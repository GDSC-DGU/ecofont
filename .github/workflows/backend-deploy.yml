name: Backend Deploy (Cloud Run)

# develop에 백엔드/배포 설정 변경이 push되면 이미지를 빌드해 Cloud Run 새 revision 배포.
# 인증은 Workload Identity Federation(키리스). 인프라 자체는 Terraform이 관리.
on:
  push:
    branches: [develop]
    paths:
      - "apps/backend/**"
      - "infra/cloud_run.tf"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

env:
  PROJECT_ID: ecofont-re
  REGION: asia-northeast3
  REPO: ecofont
  SERVICE: ecofont-backend
  IMAGE_NAME: backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # WIF OIDC 토큰 발급에 필요
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build & push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker build --platform linux/amd64 -t "$IMAGE" apps/backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --image="${IMAGE}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --quiet

      - name: Output deployed URL
        run: |
          gcloud run services describe "${SERVICE}" \
            --region="${REGION}" --project="${PROJECT_ID}" \
            --format='value(status.url)'
