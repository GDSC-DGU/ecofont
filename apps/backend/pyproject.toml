[project]
name = "ecofont-backend"
version = "0.1.0"
description = "Eco-Font backend — TTF 폰트를 잉크 절약형 에코폰트로 변환하는 FastAPI 서비스"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "google-cloud-storage>=2.18",
    "google-auth>=2.35",
    "fonttools>=4.55",
    "numpy>=2.1",
    "scipy>=1.14",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pyright>=1.1.385",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
